[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillforge-research"
version = "0.1.0"
description = "Specification and reference semantics for LTLf-composed neural/RMV robot skills"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["jsonschema>=4.23,<5"]
verify = ["z3-solver==5.3.3.0"]
replay = ["numpy==1.26.4", "MinAtar==1.0.15"]
editor = ["numpy==1.26.4"]

[tool.setuptools.packages.find]
where = ["src"]
